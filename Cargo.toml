[workspace]
resolver = "2"
members = [
    "crates/zagros-primitives",
    "crates/zagros-crypto",
    "crates/zagros-types",
    "crates/zagros-storage",
    "crates/zagros-state",
    "crates/zagros-executor",
    "crates/zagros-scheduler",
    "crates/zagros-mempool",
    "crates/zagros-network",
    "crates/zagros-consensus",
    "crates/zagros-rpc",
    "crates/zagros-metrics",
    "crates/zagros-cli",
    "crates/zagros-tests",
    "crates/zagros-runtime",
    "crates/zagros-relayer",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Zagros Network"]
license = "BUSL-1.1"
repository = "https://github.com/2bsrwjskys-coder/Zagros-Core"
homepage = "https://zagros.network"

[profile.release]
overflow-checks = true

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
dashmap = "6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rocksdb = "0.22"
hex = "0.4"
sha3 = "0.10"
tracing = "0.1"
thiserror = "1.0"
secp256k1 = { version = "0.29", features = ["recovery", "global-context"] }
# item 8/15: snapshot ve manuel-kurtarma CLI alt-komutları için. Workspace'te
# bu PR'dan ÖNCE hiç arg-parsing yoktu.
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1.9", features = ["derive"] }
rand = "0.8"

